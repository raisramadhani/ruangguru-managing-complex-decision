<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Fire: True or False?</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
        type="image/svg+xml" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .fire-game-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffffff;
        }

        .header-btns {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-start {
            background: #ff6b6b;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .btn-start:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #4ecdc4;
            box-shadow: 0 4px 10px rgba(78, 205, 196, 0.3);
        }

        .btn-reset:hover {
            background: #39bda7;
            transform: translateY(-2px);
        }

        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 25px;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .game-arena {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 35px 25px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .statement-text {
            font-size: 1.4em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
            min-height: 80px;
        }

        .btn-options-container {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            justify-content: center;
            width: 100%;
        }

        .btn-opt {
            border: none;
            padding: 18px 45px;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            min-width: 160px;
        }

        .btn-true {
            background: #27ae60;
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-true:hover:not(:disabled) {
            background: #219653;
            transform: translateY(-3px);
        }

        .btn-false {
            background: #e74c3c;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-false:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-3px);
        }

        .btn-opt:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .feedback-toast {
            padding: 15px 30px;
            border-radius: 8px;
            margin-top: 25px;
            font-weight: bold;
            text-align: center;
            font-size: 1.2em;
            display: none;
            width: 100%;
            border: 2px solid transparent;
        }

        .final-stats-footer {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            text-align: center;
            font-size: 0.95em;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <div class="fire-game-container">
        <div class="game-header">
            <div class="game-title">🧠 Logic Speed Test</div>
            <div class="header-btns">
                <button onclick="startTrueFalseGame()" class="btn-action btn-start">⚡ Quick Start</button>
                <button onclick="resetTrueFalseGame()" class="btn-action btn-reset">🔄 Reset</button>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-label">Streak</div>
                <div id="tfStreak" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Question</div>
                <div id="tfQuestion" class="stat-value">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Timer</div>
                <div id="tfTimer" class="stat-value">10</div>
            </div>
        </div>

        <div class="game-arena">
            <div id="tfStatement" class="statement-text">
                🔥 Uji kemampuan decision logic Anda!<br><br>
                Anda memiliki 10 detik untuk tiap pernyataan.<br>
                Cepat & akurat = streak tinggi! 🚀
            </div>

            <div id="tfButtons" class="btn-options-container" style="display: none;">
                <button onclick="answerTrueFalse(true)" class="btn-opt btn-true">✅ TRUE</button>
                <button onclick="answerTrueFalse(false)" class="btn-opt btn-false">❌ FALSE</button>
            </div>

            <div id="tfResult" class="feedback-toast"></div>
        </div>

        <div id="tfStats" class="final-stats-footer">
            <strong>Max Streak:</strong> <span id="maxStreak">0</span> |
            <strong>Total Benar:</strong> <span id="totalCorrect">0</span> |
            <strong>Avg Speed:</strong> <span id="avgSpeed">0</span>s
        </div>
    </div>

    <script>
        let tfGameState = {
            streak: 0,
            maxStreak: 0,
            totalCorrect: 0,
            questionCount: 0,
            timeLeft: 10,
            timer: null,
            gameActive: false,
            questionStartTime: 0
        };

        const trueFalseStatements = [
            { statement: "Dalam Python, elif akan dieksekusi meskipun kondisi if sebelumnya sudah True", answer: false },
            { statement: "Kode: if age >= 18 and score >= 80: akan True jika age=20 dan score=75", answer: false },
            { statement: "Dictionary lookup menggunakan .get() akan return None jika key tidak ditemukan", answer: true },
            { statement: "Dalam loop dengan if-elif, semua kondisi akan dicek untuk setiap item", answer: false },
            { statement: "Modular functions membuat decision logic lebih mudah di-test dan di-maintain", answer: true },
            { statement: "Operator 'or' akan return True jika salah satu kondisi True", answer: true },
            { statement: "Nested if sebaiknya digunakan untuk semua complex decision logic", answer: false },
            { statement: "Early return dalam function membantu mengurangi nesting level", answer: true },
            { statement: "Kondisi if age < 18: akan True untuk age = 18", answer: false },
            { statement: "Dictionary-based decision tables lebih scalable daripada if-elif chains yang panjang", answer: true },
            { statement: "Dalam expression: score >= 80 and attendance >= 90, jika score < 80, attendance tidak akan dicek", answer: true },
            { statement: "Function yang return tuple (bool, message) lebih informatif daripada yang hanya return bool", answer: true },
            { statement: "Maximum discount cap sebaiknya diterapkan sebelum menghitung individual discounts", answer: false },
            { statement: "Conditional logic dalam loop akan memperlambat performa secara signifikan", answer: false },
            { statement: "Business rules sebaiknya di-hardcode dalam logic flow untuk efficiency", answer: false }
        ];

        let shuffledStatements = [];

        function startTrueFalseGame() {
            shuffledStatements = [...trueFalseStatements].sort(() => Math.random() - 0.5);

            tfGameState = {
                streak: 0,
                maxStreak: 0,
                totalCorrect: 0,
                questionCount: 0,
                timeLeft: 10,
                timer: null,
                gameActive: true,
                questionStartTime: Date.now()
            };

            updateTFDisplay();
            document.getElementById('tfStats').style.display = 'none';
            loadNextStatement();
        }

        function resetTrueFalseGame() {
            clearInterval(tfGameState.timer);
            tfGameState = {
                streak: 0,
                maxStreak: 0,
                totalCorrect: 0,
                questionCount: 0,
                timeLeft: 10,
                timer: null,
                gameActive: false,
                questionStartTime: 0
            };

            updateTFDisplay();

            document.getElementById('tfStatement').innerHTML = `
        🔥 Uji kemampuan decision logic Anda!<br><br>
        Anda memiliki 10 detik untuk tiap pernyataan.<br>
        Cepat & akurat = streak tinggi! 🚀
      `;
            document.getElementById('tfButtons').style.display = 'none';
            document.getElementById('tfResult').style.display = 'none';
            document.getElementById('tfStats').style.display = 'none';
        }

        function loadNextStatement() {
            if (tfGameState.questionCount >= shuffledStatements.length) {
                endTrueFalseGame();
                return;
            }

            const statement = shuffledStatements[tfGameState.questionCount];
            tfGameState.questionStartTime = Date.now();
            tfGameState.timeLeft = 10;

            document.getElementById('tfStatement').innerHTML = `
        <div style="color: #ffd93d; font-size: 0.85em; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase;">
          Statement #${tfGameState.questionCount + 1}
        </div>
        ${statement.statement}
      `;

            document.getElementById('tfButtons').style.display = 'flex';
            document.getElementById('tfResult').style.display = 'none';

            startCountdown();
        }

        function startCountdown() {
            clearInterval(tfGameState.timer);
            tfGameState.timer = setInterval(() => {
                tfGameState.timeLeft--;
                document.getElementById('tfTimer').textContent = tfGameState.timeLeft;

                if (tfGameState.timeLeft <= 0) {
                    clearInterval(tfGameState.timer);
                    answerTrueFalse(null);
                }
            }, 1000);
        }

        function answerTrueFalse(answer) {
            clearInterval(tfGameState.timer);
            const statement = shuffledStatements[tfGameState.questionCount];
            const correct = (answer === statement.answer);

            document.querySelectorAll('#tfButtons button').forEach(btn => btn.disabled = true);
            const resDiv = document.getElementById('tfResult');

            if (answer === null) {
                tfGameState.streak = 0;
                resDiv.style.cssText = 'display: block; background: #f39c12; color: white; border: 2px solid #e67e22;';
                resDiv.innerHTML = '⏰ Waktu habis! Streak Reset!';
            } else if (correct) {
                tfGameState.streak++;
                tfGameState.totalCorrect++;
                tfGameState.maxStreak = Math.max(tfGameState.maxStreak, tfGameState.streak);

                resDiv.style.cssText = 'display: block; background: #27ae60; color: white; border: 2px solid #229954;';
                resDiv.innerHTML = `🎉 Benar! Streak: ${tfGameState.streak} 🔥`;
            } else {
                tfGameState.streak = 0;
                resDiv.style.cssText = 'display: block; background: #e74c3c; color: white; border: 2px solid #c0392b;';
                resDiv.innerHTML = `❌ Salah! Streak Reset! 💔<br><small>Jawaban: ${statement.answer ? 'TRUE' : 'FALSE'}</small>`;
            }

            tfGameState.questionCount++;
            updateTFDisplay();

            setTimeout(() => {
                document.querySelectorAll('#tfButtons button').forEach(btn => btn.disabled = false);
                loadNextStatement();
            }, 1200);
        }

        function updateTFDisplay() {
            document.getElementById('tfStreak').textContent = tfGameState.streak;
            document.getElementById('tfQuestion').textContent = tfGameState.questionCount + 1;
            document.getElementById('tfTimer').textContent = tfGameState.timeLeft;
        }

        function endTrueFalseGame() {
            const avgTime = tfGameState.totalCorrect > 0 ?
                (10 - (Date.now() - tfGameState.questionStartTime) / 1000 / tfGameState.questionCount).toFixed(1) : 0;

            document.getElementById('maxStreak').textContent = tfGameState.maxStreak;
            document.getElementById('totalCorrect').textContent = tfGameState.totalCorrect;
            document.getElementById('avgSpeed').textContent = avgTime;

            let msg = '';
            if (tfGameState.maxStreak >= 10) msg = '🏆 Logic Master! Streak yang luar biasa!';
            else if (tfGameState.maxStreak >= 7) msg = '🌟 Hebat! Kemampuan logika Anda sangat bagus!';
            else if (tfGameState.maxStreak >= 5) msg = '👍 Lumayan bagus! Teruslah berlatih!';
            else msg = '💪 Terus belajar! Latihan membuat sempurna.';

            document.getElementById('tfStatement').innerHTML = `
        <div style="font-size: 1.5em; margin-bottom: 10px;">🎊 Game Selesai!</div>
        ${msg}<br><br>
        <strong>Max Streak:</strong> ${tfGameState.maxStreak} | <strong>Akurasi:</strong> ${Math.round((tfGameState.totalCorrect / tfGameState.questionCount) * 100)}%
      `;

            document.getElementById('tfButtons').style.display = 'none';
            document.getElementById('tfResult').style.display = 'none';
            document.getElementById('tfStats').style.display = 'block';
            tfGameState.gameActive = false;
        }
    </script>
</body>

</html>
